name: Release Chrome extension

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.mjs "$RELEASE_TAG"
      - name: Check TypeScript and versions
        run: npm run check
      - name: Build extension
        run: npm run build
      - name: Create release ZIP
        run: node scripts/package.mjs
      - name: Verify release ZIP
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: unzip -t "release/bettermykoob-${RELEASE_TAG}.zip"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" "release/bettermykoob-${RELEASE_TAG}.zip" --verify-tag --generate-notes --title "BetterMykoob $RELEASE_TAG"
